<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fef9f3">
<title>晶晶大王 · 专属点单</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
/* ============================================================
   CSS Custom Properties
   ============================================================ */
:root {
  --bg-primary: #fef9f3;
  --bg-secondary: #faf4eb;
  --bg-tertiary: #f5eddf;
  --bg-input: #ffffff;
  --bg-overlay: rgba(0,0,0,0.4);
  --border-subtle: #e8dccf;
  --border-active: #d4879a;

  --text-primary: #4a3728;
  --text-secondary: #8c7b6e;
  --text-muted: #b8a99a;
  --text-accent: #c8756a;

  --accent-wine: #d4879a;
  --accent-wine-hover: #e8a0b4;
  --accent-wine-light: rgba(212,135,154,0.15);
  --accent-gold: #c8756a;
  --accent-gold-dim: #b5655d;
  --accent-gold-light: rgba(200,117,106,0.12);

  --success: #7ba587;
  --success-light: rgba(123,165,135,0.15);
  --warning: #d4a574;
  --warning-light: rgba(212,165,116,0.15);
  --danger: #c97b84;
  --danger-light: rgba(201,123,132,0.15);
  --info: #8ba4c9;
  --info-light: rgba(139,164,201,0.15);

  --space-xs: 4px;  --space-sm: 8px;  --space-md: 16px;
  --space-lg: 24px; --space-xl: 32px; --space-2xl: 48px;

  --font-display: 'Playfair Display', 'Noto Serif SC', serif;
  --font-body: 'Inter', 'Noto Sans SC', sans-serif;

  --radius-sm: 6px; --radius-md: 12px; --radius-lg: 20px; --radius-full: 9999px;

  --shadow-card: 0 2px 12px rgba(0,0,0,0.06);
  --shadow-elevated: 0 8px 32px rgba(0,0,0,0.12);
  --shadow-gold: 0 0 20px rgba(200,117,106,0.12);

  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --duration-fast: 150ms;
  --duration-normal: 300ms;
  --duration-slow: 500ms;
}

/* ============================================================
   Reset & Base
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }
body {
  font-family: var(--font-body);
  background: #f0e8da;
  color: var(--text-primary);
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  overflow-x: hidden;
}
#app {
  width: 100%;
  max-width: 480px;
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--bg-primary);
  position: relative;
  overflow-x: hidden;
  box-shadow: 0 0 60px rgba(0,0,0,0.1);
}
input, textarea, select, button { font-family: inherit; font-size: inherit; outline: none; border: none; }
button { cursor: pointer; background: none; color: inherit; }
img { max-width: 100%; display: block; }
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 4px; }

/* ============================================================
   Header
   ============================================================ */
.header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(254,249,243,0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border-subtle);
  padding: var(--space-md) var(--space-lg);
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--space-md);
}
.header-brand {
  display: flex; align-items: center; gap: var(--space-sm);
}
.header-logo {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, var(--accent-wine), #e8a0b4);
  border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}
.header-title {
  font-family: var(--font-display);
  font-size: 1.1rem; font-weight: 600;
  letter-spacing: 0.5px;
}
.header-actions { display: flex; align-items: center; gap: var(--space-sm); }
.header-btn {
  width: 40px; height: 40px; border-radius: var(--radius-full);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; color: var(--text-secondary);
  transition: all var(--duration-fast) var(--ease-out);
  position: relative;
}
.header-btn:hover, .header-btn:active { color: var(--text-primary); background: var(--bg-tertiary); }
.header-btn.active { color: var(--accent-gold); }
.badge-dot {
  position: absolute; top: 6px; right: 6px;
  min-width: 18px; height: 18px; padding: 0 5px;
  background: var(--accent-wine); color: #fff;
  font-size: 0.65rem; font-weight: 700;
  border-radius: var(--radius-full);
  display: flex; align-items: center; justify-content: center;
  line-height: 1;
  animation: pulse-badge 2s ease-in-out infinite;
}
.badge-dot:empty { display: none; }
@keyframes pulse-badge {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.15); }
}

/* WebSocket status dot */
.ws-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--text-muted);
  margin-left: 2px;
  flex-shrink: 0;
  transition: background var(--duration-normal) var(--ease-out);
}
.ws-dot.connected { background: var(--success); }
.ws-dot.disconnected { background: var(--danger); }

/* ============================================================
   Main Layout
   ============================================================ */
.main-content {
  padding: var(--space-md) var(--space-lg);
  padding-bottom: 100px;
}

/* ============================================================
   Category Tabs
   ============================================================ */
.cat-tabs {
  display: flex; gap: var(--space-sm);
  padding: var(--space-sm) 0 var(--space-md);
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.cat-tabs::-webkit-scrollbar { display: none; }
.cat-tab {
  padding: var(--space-sm) var(--space-lg);
  border-radius: var(--radius-full);
  font-size: 0.875rem; font-weight: 500;
  color: var(--text-secondary);
  background: var(--bg-secondary);
  border: 1px solid var(--border-subtle);
  white-space: nowrap;
  transition: all var(--duration-fast) var(--ease-out);
}
.cat-tab:hover { color: var(--text-primary); border-color: var(--border-active); }
.cat-tab.active {
  background: var(--accent-wine);
  border-color: var(--accent-wine);
  color: #fff;
}

/* ============================================================
   Random Picker
   ============================================================ */
.random-picker { padding-bottom: var(--space-md); }
.random-btn {
  width: 100%; padding: 14px 20px;
  background: linear-gradient(135deg, rgba(212,168,75,0.12), rgba(212,168,75,0.05));
  border: 1px dashed var(--accent-gold-dim);
  border-radius: var(--radius-md);
  font-size: 1rem; font-weight: 600;
  color: var(--accent-gold);
  display: flex; align-items: center; justify-content: center; gap: var(--space-sm);
  cursor: pointer;
  transition: all var(--duration-normal) var(--ease-out);
  position: relative; overflow: hidden;
}
.random-btn::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent);
  transform: translateX(-100%);
}
.random-btn:hover::before { animation: shimmer 1.5s infinite; }
@keyframes shimmer { 100% { transform: translateX(100%); } }
.random-btn:hover {
  border-color: var(--accent-gold);
  background: linear-gradient(135deg, rgba(212,168,75,0.2), rgba(212,168,75,0.08));
  box-shadow: 0 0 24px rgba(212,168,75,0.15);
  transform: translateY(-1px);
}
.random-btn:active { transform: scale(0.97); }
.random-dice { font-size: 1.4rem; animation: dice-idle 3s ease-in-out infinite; }
@keyframes dice-idle {
  0%, 100% { transform: rotate(0deg); }
  25% { transform: rotate(-10deg); }
  75% { transform: rotate(10deg); }
}
.random-sparkle { font-size: 0.9rem; }
.random-shuffling .random-dice { animation: dice-roll 0.6s ease-out; }
@keyframes dice-roll {
  0% { transform: rotate(0deg) scale(1); }
  50% { transform: rotate(180deg) scale(1.3); }
  100% { transform: rotate(360deg) scale(1); }
}

/* random result card */
.random-result-card {
  background: var(--bg-tertiary);
  border: 2px solid var(--accent-gold);
  border-radius: var(--radius-lg);
  padding: var(--space-lg);
  margin-bottom: var(--space-md);
  text-align: center;
  animation: result-pop 0.4s var(--ease-out);
  display: none;
}
.random-result-card.show { display: block; }
@keyframes result-pop {
  from { opacity: 0; transform: scale(0.8) translateY(10px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
.random-result-emoji { font-size: 3rem; margin-bottom: var(--space-sm); }
.random-result-name {
  font-family: var(--font-display); font-size: 1.3rem; font-weight: 700;
  color: var(--accent-gold); margin-bottom: 4px;
}
.random-result-meta {
  font-size: 0.85rem; color: var(--text-secondary);
  margin-bottom: var(--space-sm);
}
.random-result-price {
  font-size: 1.4rem; font-weight: 700; color: var(--accent-gold);
  margin-bottom: var(--space-md);
}
.random-result-price::before { content: '¥'; font-size: 0.8rem; margin-right: 2px; }
.random-result-actions {
  display: flex; gap: var(--space-sm); justify-content: center;
}
.btn-random-action {
  padding: 10px 24px; border-radius: var(--radius-full);
  font-size: 0.9rem; font-weight: 600;
  transition: all var(--duration-fast) var(--ease-out);
  display: flex; align-items: center; gap: 6px;
}
.btn-random-pickit {
  background: var(--accent-gold); color: #1a1a1a;
}
.btn-random-pickit:hover { filter: brightness(1.15); transform: translateY(-1px); }
.btn-random-reroll {
  background: var(--bg-secondary); color: var(--text-secondary);
  border: 1px solid var(--border-subtle);
}
.btn-random-reroll:hover { border-color: var(--text-muted); color: var(--text-primary); }

/* ============================================================
   Menu Grid
   ============================================================ */
.menu-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-md);
}
.menu-card {
  background: var(--bg-secondary);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  overflow: hidden;
  transition: all var(--duration-normal) var(--ease-out);
  cursor: pointer;
}
.menu-card:hover { border-color: var(--border-active); transform: translateY(-2px); box-shadow: var(--shadow-card); }
.menu-card:active { transform: scale(0.98); }
.menu-card.dimmed { opacity: 0.4; pointer-events: none; }
.card-img {
  width: 100%; aspect-ratio: 4/3;
  object-fit: cover;
  background: var(--bg-tertiary);
  position: relative;
}
.card-img-placeholder {
  width: 100%; aspect-ratio: 4/3;
  background: linear-gradient(135deg, var(--bg-tertiary), #252540);
  display: flex; align-items: center; justify-content: center;
  font-size: 3rem;
}
.card-body { padding: var(--space-sm) var(--space-md) var(--space-md); }
.card-name {
  font-size: 0.95rem; font-weight: 600;
  margin-bottom: 2px;
  display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-desc {
  font-size: 0.75rem; color: var(--text-muted);
  margin-bottom: var(--space-sm);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden;
  min-height: 2.2em;
}
.card-footer {
  display: flex; align-items: center; justify-content: space-between;
}
.card-price {
  font-size: 1.1rem; font-weight: 700;
  color: var(--accent-gold);
  font-family: var(--font-display);
}
.card-price::before { content: '¥'; font-size: 0.7rem; margin-right: 1px; opacity: 0.8; }
.btn-add {
  width: 32px; height: 32px; border-radius: var(--radius-full);
  background: var(--accent-wine);
  color: #fff; font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  transition: all var(--duration-fast) var(--ease-out);
  flex-shrink: 0;
}
.btn-add:hover { background: var(--accent-wine-hover); transform: scale(1.1); }
.btn-add:active { transform: scale(0.9); }

/* ============================================================
   Management Tabs
   ============================================================ */
.mgmt-tabs {
  display: flex; gap: 0;
  background: var(--bg-secondary);
  border-radius: var(--radius-md);
  padding: 3px;
  margin-bottom: var(--space-lg);
  border: 1px solid var(--border-subtle);
}
.mgmt-tab {
  flex: 1; text-align: center;
  padding: var(--space-sm) var(--space-md);
  font-size: 0.875rem; font-weight: 500;
  color: var(--text-secondary);
  border-radius: calc(var(--radius-md) - 3px);
  transition: all var(--duration-fast) var(--ease-out);
}
.mgmt-tab.active {
  background: var(--accent-wine);
  color: #fff;
}

/* ============================================================
   Filter Pills (Order Status)
   ============================================================ */
.filter-pills {
  display: flex; gap: var(--space-sm);
  margin-bottom: var(--space-lg);
  overflow-x: auto;
  scrollbar-width: none;
}
.filter-pills::-webkit-scrollbar { display: none; }
.filter-pill {
  padding: 6px 16px;
  border-radius: var(--radius-full);
  font-size: 0.8rem; font-weight: 500;
  color: var(--text-secondary);
  background: var(--bg-secondary);
  border: 1px solid var(--border-subtle);
  white-space: nowrap;
  transition: all var(--duration-fast) var(--ease-out);
}
.filter-pill.active {
  background: var(--info-light);
  border-color: var(--info);
  color: var(--info);
}
.filter-pill.count-new.active { background: var(--danger-light); border-color: var(--danger); color: var(--danger); }
.filter-pill.count-progress.active { background: var(--warning-light); border-color: var(--warning); color: var(--warning); }
.filter-pill.count-done.active { background: var(--success-light); border-color: var(--success); color: var(--success); }

/* ============================================================
   Order Cards (Management)
   ============================================================ */
.order-list { display: flex; flex-direction: column; gap: var(--space-md); }
.order-card {
  background: var(--bg-secondary);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: var(--space-md);
  transition: all var(--duration-normal) var(--ease-out);
}
.order-card.new-order { border-color: var(--danger); animation: glow-new 2s ease-in-out infinite; }
@keyframes glow-new {
  0%, 100% { box-shadow: 0 0 0 rgba(192,57,43,0); }
  50% { box-shadow: 0 0 20px rgba(192,57,43,0.2); }
}
.order-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: var(--space-sm);
}
.order-id { font-size: 0.75rem; color: var(--text-muted); font-family: monospace; }
.order-time { font-size: 0.75rem; color: var(--text-muted); }
.order-status {
  font-size: 0.7rem; font-weight: 600; padding: 3px 10px;
  border-radius: var(--radius-full); letter-spacing: 0.5px;
}
.status-new { background: var(--danger-light); color: var(--danger); }
.status-accepted { background: var(--warning-light); color: var(--warning); }
.status-completed { background: var(--success-light); color: var(--success); }
.status-cancelled { background: var(--bg-tertiary); color: var(--text-muted); }

.order-items { margin-bottom: var(--space-sm); }
.order-item-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 4px 0; font-size: 0.875rem;
}
.order-item-name { flex: 1; }
.order-item-qty { color: var(--text-muted); margin: 0 var(--space-sm); }
.order-item-price { color: var(--accent-gold); font-weight: 600; white-space: nowrap; }
.order-item-note {
  font-size: 0.7rem; color: var(--accent-gold-dim);
  margin-left: var(--space-md); font-style: italic;
}
.order-note {
  font-size: 0.75rem; color: var(--text-muted);
  padding: var(--space-xs) 0; border-top: 1px solid var(--border-subtle);
  margin-bottom: var(--space-sm);
}
.order-total {
  font-size: 1.1rem; font-weight: 700; color: var(--accent-gold);
  text-align: right; padding-top: var(--space-sm);
  border-top: 1px solid var(--border-subtle);
}
.order-actions { display: flex; gap: var(--space-sm); margin-top: var(--space-sm); }
.btn-sm {
  padding: 6px 16px; border-radius: var(--radius-sm);
  font-size: 0.8rem; font-weight: 600;
  transition: all var(--duration-fast) var(--ease-out);
}
.btn-accept { background: var(--info); color: #fff; }
.btn-accept:hover { filter: brightness(1.2); }
.btn-complete { background: var(--success); color: #fff; }
.btn-complete:hover { filter: brightness(1.2); }
.btn-cancel { background: var(--bg-tertiary); color: var(--text-muted); }
.btn-cancel:hover { background: var(--danger); color: #fff; }
.btn-reorder { background: var(--accent-wine); color: #fff; }
.btn-reorder:hover { background: var(--accent-wine-hover); }

/* ============================================================
   Menu Management List
   ============================================================ */
.menu-mgmt-list { display: flex; flex-direction: column; gap: var(--space-sm); }
.menu-mgmt-item {
  display: flex; align-items: center; gap: var(--space-md);
  background: var(--bg-secondary); border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md); padding: var(--space-sm) var(--space-md);
  transition: all var(--duration-fast) var(--ease-out);
}
.menu-mgmt-item:hover { border-color: var(--border-active); }
.menu-mgmt-item.offline { opacity: 0.4; }
.menu-mgmt-img {
  width: 56px; height: 56px; border-radius: var(--radius-sm);
  object-fit: cover; background: var(--bg-tertiary); flex-shrink: 0;
}
.menu-mgmt-img-placeholder {
  width: 56px; height: 56px; border-radius: var(--radius-sm);
  background: var(--bg-tertiary);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.5rem; flex-shrink: 0;
}
.menu-mgmt-info { flex: 1; min-width: 0; }
.menu-mgmt-name { font-size: 0.9rem; font-weight: 600; margin-bottom: 2px; }
.menu-mgmt-meta {
  font-size: 0.75rem; color: var(--text-muted);
  display: flex; gap: var(--space-sm);
}
.menu-mgmt-price { color: var(--accent-gold); font-weight: 600; }
.menu-mgmt-actions { display: flex; gap: 4px; flex-shrink: 0; }
.btn-icon {
  width: 32px; height: 32px; border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; color: var(--text-secondary);
  transition: all var(--duration-fast) var(--ease-out);
}
.btn-icon:hover { background: var(--bg-tertiary); color: var(--text-primary); }
.btn-icon.danger:hover { background: var(--danger-light); color: var(--danger); }

/* ============================================================
   FAB (Add Button)
   ============================================================ */
.fab {
  position: fixed; bottom: 24px; right: 24px;
  width: 52px; height: 52px; border-radius: var(--radius-full);
  background: linear-gradient(135deg, var(--accent-wine), #e8a0b4);
  color: #fff; font-size: 22px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: var(--shadow-elevated);
  z-index: 50;
  transition: all var(--duration-fast) var(--ease-out);
}
.fab:hover { transform: scale(1.1); }
.fab:active { transform: scale(0.9); }

/* ============================================================
   Cart Panel (Off-canvas)
   ============================================================ */
.cart-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: var(--bg-overlay);
  opacity: 0; pointer-events: none;
  transition: opacity var(--duration-normal) var(--ease-out);
}
.cart-overlay.open { opacity: 1; pointer-events: auto; }
.cart-panel {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: min(85vw, 380px); max-width: 100%;
  background: var(--bg-primary);
  border-left: 1px solid var(--border-subtle);
  z-index: 201;
  display: flex; flex-direction: column;
  transform: translateX(100%);
  transition: transform var(--duration-slow) var(--ease-out);
  box-shadow: var(--shadow-elevated);
}
.cart-panel.open { transform: translateX(0); }

.cart-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--space-md) var(--space-lg);
  border-bottom: 1px solid var(--border-subtle);
}
.cart-title { font-family: var(--font-display); font-size: 1.1rem; font-weight: 600; }
.cart-close {
  width: 36px; height: 36px; border-radius: var(--radius-full);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-secondary); font-size: 20px;
  transition: all var(--duration-fast) var(--ease-out);
}
.cart-close:hover { background: var(--bg-tertiary); color: var(--text-primary); }

.cart-items {
  flex: 1; overflow-y: auto; padding: var(--space-md) var(--space-lg);
}
.cart-item {
  display: flex; align-items: center; gap: var(--space-sm);
  padding: var(--space-sm) 0;

  // ============================================================
  // STORAGE (Firebase + localStorage fallback)
  // ============================================================
  let _menuCache = [];
  let _ordersCache = [];
  let _useCloud = false; // true if Firebase is reachable

  // localStorage helpers (fallback)
  const LStore = {
    getMenu() { try { const r = localStorage.getItem('menuItems'); return r ? JSON.parse(r) : null; } catch(e) { return null; } },
    saveMenu(arr) { localStorage.setItem('menuItems', JSON.stringify(arr)); },
    getOrders() { try { const r = localStorage.getItem('orders'); return r ? JSON.parse(r) : []; } catch(e) { return []; } },
    saveOrders(arr) { localStorage.setItem('orders', JSON.stringify(arr)); }
  };

  const Storage = {
    genId(prefix) {
      return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
    },

    useCloud() { return _useCloud; },

    // Menu
    getMenuCached() { return _menuCache; },

    async saveMenu(arr) {
      _menuCache = arr;
      try {
        const obj = {};
        arr.forEach(item => { obj[item.id] = item; });
        await db.ref('menuItems').set(obj);
      } catch(e) { /* Firebase not available, local fallback */ }
      LStore.saveMenu(arr);
    },

    // Orders
    getOrdersCached() { return _ordersCache; },

    async saveOrder(order) {
      _ordersCache.push(order);
      try { await db.ref('orders/' + order.id).set(order); } catch(e) {}
      LStore.saveOrders(_ordersCache);
    },

    async updateOrder(order) {
      const idx = _ordersCache.findIndex(o => o.id === order.id);
      if (idx >= 0) _ordersCache[idx] = order;
      try { await db.ref('orders/' + order.id).set(order); } catch(e) {}
      LStore.saveOrders(_ordersCache);
    },

    async seedIfNeeded() {
      if (_useCloud) {
        try {
          const snap = await db.ref('menuItems').once('value');
          if (snap.exists()) {
            _menuCache = Object.values(snap.val());
            return;
          }
        } catch(e) {
          console.warn('[Firebase] 读取失败，使用本地存储:', e.message);
          _useCloud = false;
        }
      }

      // Fallback: localStorage
      let menu = LStore.getMenu();
      if (!menu || menu.length === 0) {
        menu = SEED_DATA.map((d, i) => ({
          id: this.genId('m'),
          name: d.name,
          category: d.category,
          price: d.price,
          image: d.image || '',
          description: d.description || '',
          isAvailable: true,
          createdAt: Date.now() - (SEED_DATA.length - i) * 60000
        }));
        LStore.saveMenu(menu);
      }
      _menuCache = menu;
      _ordersCache = LStore.getOrders();
    },

    // Subscribe to real-time updates (Firebase only)
    subscribe() {
      console.log('[Firebase] 开始实时监听...');

      // Pull latest data + subscribe
      db.ref('menuItems').on('value', (snap) => {
        const data = snap.val();
        if (data) {
          _menuCache = Object.values(data);
          LStore.saveMenu(_menuCache);
          if (State.currentView === 'ordering') Render.menuGrid();
          else if (State.mgmtTab === 'menu') Render.menuMgmtList();
        }
      });

      db.ref('orders').on('value', (snap) => {
        const data = snap.val();
        const oldLen = _ordersCache.length;
        _ordersCache = data ? Object.values(data) : [];
        LStore.saveOrders(_ordersCache);
        const newLen = _ordersCache.length;

        if (newLen > oldLen && oldLen > 0) {
          if (State.currentView === 'management' && State.mgmtTab === 'orders') {
            Render.orderList(); Render.orderFilters();
          }
          toast('🍜 收到新的投喂请求！', 'info');
        }
        if (State.currentView === 'management') {
          Render.orderList(); Render.orderFilters();
        } else {
          _ordersCache.forEach(no => {
            if (no.status === 'accepted' && !no._notifiedAccepted) {
              toast('🍳 饲养员开始制作啦~', 'success');
              if (_useCloud) db.ref('orders/' + no.id + '/_notifiedAccepted').set(true);
            }
            if (no.status === 'completed' && !no._notifiedCompleted) {
              toast('✅ 投喂完成，快来享用！', 'success');
              if (_useCloud) db.ref('orders/' + no.id + '/_notifiedCompleted').set(true);
            }
          });
        }
        if (State.mgmtTab === 'history') Render.historyList();
      });
    }
  };

  // ============================================================
  // STATE
  // ============================================================
  const State = {
    currentView: 'ordering',    // 'ordering' | 'management'
    mgmtTab: 'orders',          // 'orders' | 'menu' | 'history'
    categoryFilter: '全部',
    orderFilter: 'new',
    cart: [],
    cartNote: '',
    editingId: null,
    confirmCallback: null,

    // Cart methods
    addToCart(menuItem) {
      const existing = this.cart.find(c => c.menuId === menuItem.id);
      if (existing) {
        existing.quantity++;
      } else {
        this.cart.push({
          menuId: menuItem.id,
          name: menuItem.name,
          price: menuItem.price,
          quantity: 1,
          note: ''
        });
      }
    },
    removeFromCart(menuId) {
      const idx = this.cart.findIndex(c => c.menuId === menuId);
      if (idx >= 0) {
        if (this.cart[idx].quantity > 1) {
          this.cart[idx].quantity--;
        } else {
          this.cart.splice(idx, 1);
        }
      }
    },
    updateQty(menuId, qty) {
      const item = this.cart.find(c => c.menuId === menuId);
      if (item) {
        item.quantity = Math.max(1, Math.min(99, qty));
      }
    },
    updateItemNote(menuId, note) {
      const item = this.cart.find(c => c.menuId === menuId);
      if (item) item.note = note;
    },
    clearCart() {
      this.cart = [];
      this.cartNote = '';
    },
    cartTotal() {
      return this.cart.reduce((sum, c) => sum + c.price * c.quantity, 0);
    },
    cartCount() {
      return this.cart.reduce((sum, c) => sum + c.quantity, 0);
    }
  };

  // ============================================================
  // HELPERS
  // ============================================================
  function getEmoji(category, index) {
    const pool = FOOD_EMOJI[category] || ['🍽️'];
    return pool[index % pool.length];
  }

  function formatPrice(n) {
    return Number(n).toFixed(2);
  }

  function formatTime(ts) {
    const d = new Date(ts);
    const now = new Date();
    const pad = n => String(n).padStart(2, '0');
    const time = `${pad(d.getHours())}:${pad(d.getMinutes())}`;

    if (d.toDateString() === now.toDateString()) return '今天 ' + time;
    const yesterday = new Date(now);
    yesterday.setDate(yesterday.getDate() - 1);
    if (d.toDateString() === yesterday.toDateString()) return '昨天 ' + time;

    return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${time}`;
  }

  function formatDateLabel(ts) {
    const d = new Date(ts);
    const now = new Date();
    if (d.toDateString() === now.toDateString()) return '今天';
    const yesterday = new Date(now);
    yesterday.setDate(yesterday.getDate() - 1);
    if (d.toDateString() === yesterday.toDateString()) return '昨天';
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  }

  function groupByDate(orders) {
    const groups = {};
    orders.forEach(o => {
      const label = formatDateLabel(o.createdAt);
      if (!groups[label]) groups[label] = [];
      groups[label].push(o);
    });
    return groups;
  }

  function toast(msg, type) {
    type = type || 'info';
    const container = document.getElementById('toastContainer');
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.textContent = msg;
    container.appendChild(el);
    setTimeout(() => {
      el.classList.add('out');
      el.addEventListener('animationend', () => el.remove());
    }, 2200);
  }

        empty.classList.remove('hidden');
        return;

      empty.classList.add('hidden');

      const overlay = document.getElementById('modalOverlay');
      const title = document.getElementById('modalTitle');
      document.getElementById('formEditId').value = '';

      if (mode === 'add') {
        title.textContent = '✨ 添加菜品';
        document.getElementById('formName').value = '';
        document.getElementById('formCategory').value = '荤菜';
        document.getElementById('formPrice').value = '';
        document.getElementById('formImage').value = '';
        document.getElementById('formDesc').value = '';
      } else if (mode === 'edit' && item) {
        title.textContent = '✏️ 编辑菜品';
        document.getElementById('formEditId').value = item.id;
        document.getElementById('formName').value = item.name;
        document.getElementById('formCategory').value = item.category;
        document.getElementById('formPrice').value = item.price;
        document.getElementById('formImage').value = item.image || '';
        document.getElementById('formDesc').value = item.description || '';
      }
      State.editingId = mode === 'edit' ? item.id : null;
      overlay.classList.add('open');
    },

    closeModal() {
      document.getElementById('modalOverlay').classList.remove('open');
      State.editingId = null;
    },

    // --- Confirm Dialog ---
    showConfirm(msg, callback) {
      document.getElementById('confirmMsg').textContent = msg;
      document.getElementById('confirmOverlay').classList.add('open');
      State.confirmCallback = callback;
    },

    closeConfirm() {
      document.getElementById('confirmOverlay').classList.remove('open');
      State.confirmCallback = null;
    },

    // --- History ---
    historyList() {
      const container = document.getElementById('historyList');
      const empty = document.getElementById('historyEmpty');
      const orders = Storage.getOrdersCached();
      const completed = orders.filter(o => o.status === 'completed' || o.status === 'cancelled');

      if (completed.length === 0) {
        container.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');

      completed.sort((a, b) => b.createdAt - a.createdAt);
      const groups = groupByDate(completed);

      container.innerHTML = Object.entries(groups).map(([dateLabel, groupOrders]) => {
        const cardsHtml = groupOrders.map(order => {
          const statusLabel = STATUS_LABEL[order.status] || order.status;
          const statusCls = STATUS_CLS[order.status] || '';
          const time = formatTime(order.createdAt);
          const total = formatPrice(order.totalAmount);
          const itemsHtml = order.items.map(it => {
            return `<div class="order-item-row">
              <span class="order-item-name">${Render._esc(it.name)}</span>
              <span class="order-item-qty">×${it.quantity}</span>
              <span class="order-item-price">¥${formatPrice(it.price * it.quantity)}</span>
            </div>`;
          }).join('');

          return `<div class="order-card">
            <div class="order-header">
              <span class="order-id">#${order.id.slice(-8)}</span>
              <span class="order-status ${statusCls}">${statusLabel}</span>
              <span class="order-time">${time}</span>
            </div>
            <div class="order-items">${itemsHtml}</div>
            ${order.note ? `<div class="order-note">💬 ${Render._esc(order.note)}</div>` : ''}
            <div class="order-total">合计 ¥${total}</div>
            <div class="order-actions">
              <button class="btn-sm btn-reorder" data-action="reorder" data-id="${order.id}">🔄 复购</button>
            </div>
          </div>`;
        }).join('');

        return `<div class="history-group">
          <div class="history-date">${dateLabel}</div>
          ${cardsHtml}
        </div>`;
      }).join('');
    },

    // --- Cart Panel Visibility ---
    cartVisibility(open) {
      const panel = document.getElementById('cartPanel');
      const overlay = document.getElementById('cartOverlay');
      if (open) {
        panel.classList.add('open');
        overlay.classList.add('open');
      } else {
        panel.classList.remove('open');
        overlay.classList.remove('open');
      }
    },

    // --- View Switching ---
    switchView(view) {
      State.currentView = view;
      document.getElementById('viewOrdering').classList.toggle('hidden', view !== 'ordering');
      document.getElementById('viewManagement').classList.toggle('hidden', view !== 'management');
      document.getElementById('btnOrdering').classList.toggle('active', view === 'ordering');
      document.getElementById('btnMgmt').classList.toggle('active', view === 'management');

      // Update lock icon
      const mgmtIcon = document.getElementById('btnMgmt').querySelector('i');
      if (view === 'management') {
        mgmtIcon.className = 'fa-solid fa-lock-open';
      } else {
        mgmtIcon.className = 'fa-solid fa-lock';
      }

      if (view === 'ordering') {
        Render.categoryTabs();
        Render.menuGrid();
      } else {
        Render.mgmtTabs();
        Render.switchMgmtPanel();
      }
    },

    switchMgmtPanel() {
      const panelOrders = document.getElementById('panelOrders');
      const panelMenuMgmt = document.getElementById('panelMenuMgmt');
      const panelHistory = document.getElementById('panelHistory');
      panelOrders.classList.toggle('hidden', State.mgmtTab !== 'orders');
      panelMenuMgmt.classList.toggle('hidden', State.mgmtTab !== 'menu');
      panelHistory.classList.toggle('hidden', State.mgmtTab !== 'history');

      if (State.mgmtTab === 'orders') {
        Render.orderFilters();
        Render.orderList();
      } else if (State.mgmtTab === 'menu') {
        Render.menuMgmtList();
      } else if (State.mgmtTab === 'history') {
        Render.historyList();
      }
      Render.mgmtTabs();
    },

    // --- Escape helper ---
    _esc(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
  };

  // ============================================================
  // EVENTS
  // ============================================================
  const app = document.getElementById('app');

  app.addEventListener('click', function(e) {
    const target = e.target.closest('[data-action]');
    if (!target) return;
    const action = target.dataset.action;

    switch(action) {
      // --- Cart Actions ---
      case 'toggle-cart':
        e.preventDefault();
        Render.cartPanel();
        Render.cartVisibility(true);
        break;

      case 'close-cart':
        Render.cartVisibility(false);
        break;

      case 'add-to-cart-menu':
      case 'add-to-cart-btn': {
        const menuId = target.dataset.id;
        const menu = Storage.getMenuCached();
        const item = menu.find(m => m.id === menuId);
        if (item && item.isAvailable) {
          State.addToCart(item);
          Render.cartPanel();
          Render.menuGrid();
          toast(`${item.name} 已加入购物车`, 'success');
        }
        break;
      }

      case 'inc-cart-qty': {
        const menuId = target.dataset.id;
        State.addToCart({
          id: menuId,
          name: '',
          price: State.cart.find(c => c.menuId === menuId)?.price || 0
        });
        Render.cartPanel();
        break;
      }

      case 'dec-cart-qty': {
        const menuId = target.dataset.id;
        State.removeFromCart(menuId);
        Render.cartPanel();
        break;
      }

      case 'submit-order': {
        if (State.cart.length === 0) {
          toast('购物车是空的，请先添加菜品', 'error');
          return;
        }
        const order = {
          id: Storage.genId('o'),
          items: State.cart.map(c => ({
            menuId: c.menuId,
            name: c.name,
            price: c.price,
            quantity: c.quantity,
            note: c.note
          })),
          totalAmount: State.cartTotal(),
          note: State.cartNote,
          status: 'new',
          createdAt: Date.now(),
          acceptedAt: null,
          completedAt: null
        };
        Storage.saveOrder(order);
        State.clearCart();
        Render.cartPanel();
        Render.cartVisibility(false);
        Render.menuGrid();
        toast('✨ 投喂申请已发送，等待饲养员处理...', 'success');
        break;
      }

      // --- View Switching ---
      case 'request-management':
        e.preventDefault();
        if (PinManager.isUnlocked()) {
          // Already unlocked — toggle back to ordering (lock)
          PinManager.lock();
          PinManager.hidePinModal();
          toast('🔒 已锁定，返回点菜模式', 'info');
        } else {
          PinManager.showPinModal(PinManager.isPinSet() ? 'auth' : 'setup');
        }
        break;

      case 'pin-submit':
        e.preventDefault();
        PinManager.handleSubmit();
        break;

      case 'pin-cancel':
        PinManager.hidePinModal();
        break;

      case 'lock-management':
        PinManager.lock();
        PinManager.hidePinModal();
        document.getElementById('btnMgmt').querySelector('i').className = 'fa-solid fa-lock';
        toast('🔒 已锁定，返回点菜模式', 'info');
        break;

      // --- Random Picker ---
      case 'random-pick': {
        e.preventDefault();
        Render.clearRandomResult();
        const item = Render.randomPick();
        if (item) Render.showRandomResult(item);
        break;
      }

      case 'random-pick-confirm': {
        const menuId = target.dataset.id;
        const menu = Storage.getMenuCached();
        const item = menu.find(m => m.id === menuId);
        if (item && item.isAvailable) {
          State.addToCart(item);
          Render.cartPanel();
          Render.clearRandomResult();
          Render.menuGrid();
          toast(`「${item.name}」已加入购物车 🎉`, 'success');
        }
        break;
      }

      // --- Category Filter ---
      case 'filter-category':
        State.categoryFilter = target.dataset.cat;
        Render.categoryTabs();
        Render.menuGrid();
        break;

      // --- Management Tabs ---
      case 'switch-mgmt-tab':
        State.mgmtTab = target.dataset.tab;
        Render.switchMgmtPanel();
        break;

      // --- Order Filter ---
      case 'filter-order-status':
        State.orderFilter = target.dataset.status;
        Render.orderFilters();
        Render.orderList();
        break;

      // --- Order Management ---
      case 'accept-order': {
        const orders = Storage.getOrdersCached();
        const order = orders.find(o => o.id === target.dataset.id);
        if (order) {
          order.status = 'accepted';
          order.acceptedAt = Date.now();
          Storage.updateOrder(order);
          Render.orderList();
          Render.orderFilters();
          toast('🍳 开始制作，马上就好~', 'info');
        }
        break;
      }

      case 'complete-order': {
        const orders = Storage.getOrdersCached();
        const order = orders.find(o => o.id === target.dataset.id);
        if (order) {
          order.status = 'completed';
          order.completedAt = Date.now();
          Storage.updateOrder(order);
          Render.orderList();
          Render.orderFilters();
          toast('✅ 投喂完成，请享用~', 'success');
        }
        break;
      }

      case 'cancel-order': {
        const orderId = target.dataset.id;
        Render.showConfirm('确定要取消这个订单吗？', () => {
          const orders = Storage.getOrdersCached();
          const order = orders.find(o => o.id === orderId);
          if (order) {
            order.status = 'cancelled';
            Storage.updateOrder(order);
            Render.orderList();
            Render.orderFilters();
            toast('订单已取消', 'info');
          }
        });
        break;
      }

      // --- Reorder ---
      case 'reorder': {
        const orders = Storage.getOrdersCached();
        const order = orders.find(o => o.id === target.dataset.id);
        if (order) {
          const menu = Storage.getMenuCached();
          order.items.forEach(it => {
            const menuItem = menu.find(m => m.id === it.menuId);
            if (menuItem && menuItem.isAvailable) {
              const existing = State.cart.find(c => c.menuId === it.menuId);
              if (existing) {
                existing.quantity += it.quantity;
              } else {
                State.cart.push({
                  menuId: it.menuId,
                  name: menuItem.name,
                  price: menuItem.price,
                  quantity: it.quantity,
                  note: it.note || ''
                });
              }
            } else {
              // Item no longer available, skip
            }
          });
          const count = order.items.length;
          Render.cartPanel();
          Render.cartVisibility(true);
          Render.switchView('ordering');
          toast(`已加入购物车 ${count} 件商品`, 'success');
        }
        break;
      }

      // --- Menu Management CRUD ---
      case 'open-modal': {
        const mode = target.dataset.mode || 'add';
        Render.openModal(mode);
        break;
      }

      case 'close-modal':
        Render.closeModal();
        break;

      case 'save-menu-item': {
        const name = document.getElementById('formName').value.trim();
        const category = document.getElementById('formCategory').value;
        const priceStr = document.getElementById('formPrice').value.trim();
        const image = document.getElementById('formImage').value.trim();
        const desc = document.getElementById('formDesc').value.trim();

        if (!name) { toast('请输入菜品名称', 'error'); return; }
        if (!priceStr || isNaN(parseFloat(priceStr)) || parseFloat(priceStr) <= 0) {
          toast('请输入有效价格', 'error'); return;
        }
        const price = Math.round(parseFloat(priceStr) * 100) / 100;

        const menu = Storage.getMenuCached();
        const editId = document.getElementById('formEditId').value;

        if (editId) {
          // Edit existing
          const item = menu.find(m => m.id === editId);
          if (item) {
            item.name = name;
            item.category = category;
            item.price = price;
            item.image = image;
            item.description = desc;
          }
        } else {
          // Add new
          menu.push({
            id: Storage.genId('m'),
            name, category, price, image,
            description: desc,
            isAvailable: true,
            createdAt: Date.now()
          });
        }

        Storage.saveMenu(menu);
        Render.closeModal();
        Render.menuMgmtList();
        Render.menuGrid();
        toast(editId ? '菜品已更新' : '菜品已添加', 'success');
        break;
      }

      case 'edit-menu-item': {
        const menu = Storage.getMenuCached();
        const item = menu.find(m => m.id === target.dataset.id);
        if (item) Render.openModal('edit', item);
        break;
      }

      case 'delete-menu-item': {
        const itemId = target.dataset.id;
        const menu = Storage.getMenuCached();
        const item = menu.find(m => m.id === itemId);
        if (!item) return;
        Render.showConfirm(`确定要删除「${item.name}」吗？删除后可在订单历史中查看过往记录。`, () => {
          const menu = Storage.getMenuCached();
          const filtered = menu.filter(m => m.id !== itemId);
          Storage.saveMenu(filtered);
                    Render.menuMgmtList();
          Render.menuGrid();
          toast(`「${item.name}」已删除`, 'info');
        });
        break;
      }

      case 'toggle-available': {
        const menu = Storage.getMenuCached();
        const item = menu.find(m => m.id === target.dataset.id);
        if (item) {
          item.isAvailable = !item.isAvailable;
          Storage.saveMenu(menu);
                    Render.menuMgmtList();
          Render.menuGrid();
          toast(item.isAvailable ? `「${item.name}」已上架` : `「${item.name}」已下架`, 'info');
        }
        break;
      }

      // --- Confirm Dialog ---
      case 'confirm-cancel':
        Render.closeConfirm();
        break;

      case 'confirm-ok':
        if (State.confirmCallback) {
          State.confirmCallback();
        }
        Render.closeConfirm();
        break;
    }
  });

  // --- Input Events (delegated) ---
  app.addEventListener('input', function(e) {
    const target = e.target.closest('[data-action]');
    if (!target) return;
    const action = target.dataset.action;

    if (action === 'update-item-note') {
      State.updateItemNote(target.dataset.id, target.value);
    }
  });

  app.addEventListener('change', function(e) {
    if (e.target.id === 'cartNoteInput') {
      State.cartNote = e.target.value;
    }
  });

  // --- Cart Overlay Click to Close ---
  document.getElementById('cartOverlay').addEventListener('click', function() {
    Render.cartVisibility(false);
  });

  // --- Modal Overlay Click to Close ---
  document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) Render.closeModal();
  });

  // --- Keyboard ---
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      if (document.getElementById('pinOverlay').classList.contains('open')) {
        PinManager.hidePinModal();
      } else if (document.getElementById('cartPanel').classList.contains('open')) {
        Render.cartVisibility(false);
      } else if (document.getElementById('modalOverlay').classList.contains('open')) {
        Render.closeModal();
      } else if (document.getElementById('confirmOverlay').classList.contains('open')) {
        Render.closeConfirm();
      }
    }
    if (e.key === 'Enter' && document.getElementById('pinOverlay').classList.contains('open')) {
      PinManager.handleSubmit();
    }
  });

  // ============================================================
  // ============================================================
  // PIN MANAGEMENT
  // ============================================================
  const PinManager = {
    _unlocked: false, // session only

    getPin() {
      return localStorage.getItem('mgmtPin') || null;
    },

    setPin(pin) {
      localStorage.setItem('mgmtPin', pin);
    },

    isPinSet() {
      return !!this.getPin();
    },

    verify(pin) {
      return pin === this.getPin();
    },

    isUnlocked() {
      return this._unlocked;
    },

    unlock() {
      this._unlocked = true;
    },

    lock() {
      this._unlocked = false;
      State.currentView = 'ordering';
      Render.switchView('ordering');
    },

    showPinModal(mode) {
      // mode: 'auth' (verify existing) or 'setup' (create new)
      const overlay = document.getElementById('pinOverlay');
      const title = document.getElementById('pinTitle');
      const subtitle = document.getElementById('pinSubtitle');
      const input = document.getElementById('pinInput');
      const lockBtn = document.getElementById('pinLockBtn');

      input.value = '';
      if (mode === 'setup' || !this.isPinSet()) {
        title.textContent = '设置密码';
        subtitle.textContent = '请设置一个6位以内数字密码';
        lockBtn.classList.add('hidden');
      } else {
        title.textContent = '饲养员验证';
        subtitle.textContent = '请输入密码进入管理';
        lockBtn.classList.remove('hidden');
      }
      overlay.classList.add('open');
      setTimeout(() => input.focus(), 300);
    },

    hidePinModal() {
      document.getElementById('pinOverlay').classList.remove('open');
    },

    handleSubmit() {
      const input = document.getElementById('pinInput');
      const pin = input.value.trim();

      if (!pin) {
        toast('请输入密码', 'error');
        return;
      }

      if (!this.isPinSet()) {
        // Setup mode
        this.setPin(pin);
        this.unlock();
        this.hidePinModal();
        State.currentView = 'management';
        Render.switchView('management');
        toast('🔑 密码已设置，下次用这个密码进入管理', 'success');
        return;
      }

      // Auth mode
      if (this.verify(pin)) {
        this.unlock();
        this.hidePinModal();
        State.currentView = 'management';
        Render.switchView('management');
        toast('👨‍🍳 欢迎回来，饲养员！', 'success');
      } else {
        toast('❌ 密码错误', 'error');
        input.value = '';
        input.focus();
      }
    }
  };

  // ============================================================
  // ============================================================
  // BOOTSTRAP
  // ============================================================
  async function bootstrap() {
    // 先用本地数据渲染（秒开不白屏）
    await Storage.seedIfNeeded();
    Render.categoryTabs();
    Render.menuGrid();
    Render.cartPanel();

    // 后台尝试连接 Firebase
    db.ref('.info/connected').on('value', (snap) => {
      const connected = snap.val() === true;
      const dot = document.getElementById('wsDot');
      if (connected && !_useCloud) {
        _useCloud = true;
        console.log('[Firebase] ☁️ 实时同步已连接');
        Storage.subscribe();
        if (dot) { dot.className = 'ws-dot connected'; dot.title = '☁️ Firebase 实时同步'; }
        toast('☁️ 实时同步已连接', 'success');
      } else if (!connected) {
        if (dot) { dot.className = 'ws-dot disconnected'; dot.title = '💾 本地模式'; }
      }
    });

    console.log('🍜 今日投喂 · 专属点单 已就绪');
  }
  bootstrap();
})();
</script>
</body>
</html>
